[project]
name = "myCancerPal"
version = "0.1.0"
description = "A longitudinal treatment companion for cancer patients — a page you carry in."
entry-point = "main.jac"
kind = "web-app"

# Written by the jachammer IDE when it snapshots the project (#27). Keep it — dropping it
# just means the IDE re-creates it on the next sync and re-opens this same conflict.
[jacpack]
name = 'myCancerPal'
description = 'Jac IDE snapshot for myCancerPal'

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
react-hook-form = "^7.54.0"
"@hookform/resolvers" = "^3.9.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

# Serves the client (def:pub app) at "/" — without this "/" stays the JSON API index.
[serve]
base_route_app = "app"

[client]
